[package]
name = "pdfword"
version = "0.1.0"
edition = "2024"
description = "PDF 轉 Word（DOCX）批次轉換工具"
license = "MIT"
publish = false

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
docx-rs = "=0.4.22"
rayon = "=1.12.0"
rfd = "=0.18.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# MoveFileExW（不覆寫的檔案提交）；沿用相依樹中已有的版本
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "=0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
