[package]
name = "pdfword"
version = "0.1.0"
edition = "2024"
description = "PDF 轉 Word（DOCX）批次轉換工具"
license = "MIT"
publish = false

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
pdfium-render = "=0.9.4"
docx-rs = "=0.4.22"
rayon = "=1.12.0"
rfd = "=0.17.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=7.0.0"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
